<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | FixTrack</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body class="login-page">

    <div class="login-container">

        <div class="login-brand">

            <div class="login-brand-mark">
                F
            </div>

            <div>

                <strong>FIXTRACK</strong>

                <span>
                    Factory Operations
                </span>

            </div>

        </div>


        <div class="login-card">

            <div class="login-header">

                <div class="eyebrow">
                    SECURE ACCESS
                </div>

                <h1>
                    Welcome back
                </h1>

                <p>
                    Sign in to access FixTrack.
                </p>

            </div>


            {% if error %}

                <div class="login-error">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                        autofocus
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Sign In
                </button>

            </form>

        </div>


        <div class="login-footer">
            FIXTRACK · v2.0
        </div>

    </div>

</body>

</html>
