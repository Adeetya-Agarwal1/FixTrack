{% extends "base.html" %}

{% block title %}
Edit Spare Part | FixTrack
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <div class="eyebrow">INVENTORY MANAGEMENT</div>
        <h1>Edit Spare Part</h1>
        <p>Update the information and stock details for this inventory item.</p>
    </div>
</div>

<div class="form-card">

    <div class="form-card-header">
        <div class="form-card-icon">▣</div>

        <div>
            <h2>Part Details</h2>
            <p>Modify the inventory information below.</p>
        </div>
    </div>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Part Code</label>
                <input
                    type="text"
                    name="part_code"
                    value="{{ part['part_code'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Part Name</label>
                <input
                    type="text"
                    name="part_name"
                    value="{{ part['part_name'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Category</label>
                <input
                    type="text"
                    name="category"
                    value="{{ part['category'] or '' }}"
                >
            </div>

            <div class="form-group">
                <label>Brand</label>
                <input
                    type="text"
                    name="brand"
                    value="{{ part['brand'] or '' }}"
                >
            </div>

            <div class="form-group">
                <label>Specification</label>
                <input
                    type="text"
                    name="specification"
                    value="{{ part['specification'] or '' }}"
                >
            </div>

            <div class="form-group">
                <label>Storage Location</label>
                <input
                    type="text"
                    name="location"
                    value="{{ part['location'] or '' }}"
                >
            </div>

            <div class="form-group">
                <label>Current Stock</label>
                <input
                    type="number"
                    name="current_stock"
                    min="0"
                    value="{{ part['current_stock'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Reorder Level</label>
                <input
                    type="number"
                    name="reorder_level"
                    min="0"
                    value="{{ part['reorder_level'] }}"
                    required
                >
            </div>

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('spare_parts.spare_parts') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
