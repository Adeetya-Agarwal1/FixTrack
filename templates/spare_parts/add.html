{% extends "base.html" %}

{% block title %}
Add Spare Part | FixTrack
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <div class="eyebrow">
            INVENTORY MANAGEMENT
        </div>

        <h1>Add Spare Part</h1>

        <p>
            Add a new inventory item and define its stock levels.
        </p>

    </div>

</div>


<div class="form-card">

    <div class="form-card-header">

        <div class="form-card-icon">
            ▣
        </div>

        <div>

            <h2>Part Details</h2>

            <p>
                Enter the information used to identify and track this part.
            </p>

        </div>

    </div>


    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Part Code
                </label>

                <input
                    type="text"
                    name="part_code"
                    placeholder="e.g. BRG-004"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Part Name
                </label>

                <input
                    type="text"
                    name="part_name"
                    placeholder="e.g. Ball Bearing"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <input
                    type="text"
                    name="category"
                    placeholder="e.g. Bearings"
                >

            </div>


            <div class="form-group">

                <label>
                    Brand
                </label>

                <input
                    type="text"
                    name="brand"
                    placeholder="e.g. SKF"
                >

            </div>


            <div class="form-group">

                <label>
                    Specification
                </label>

                <input
                    type="text"
                    name="specification"
                    placeholder="e.g. 6204-2RS"
                >

            </div>


            <div class="form-group">

                <label>
                    Storage Location
                </label>

                <input
                    type="text"
                    name="location"
                    placeholder="e.g. Rack A-03"
                >

            </div>


            <div class="form-group">

                <label>
                    Current Stock
                </label>

                <input
                    type="number"
                    name="current_stock"
                    min="0"
                    value="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Reorder Level
                </label>

                <input
                    type="number"
                    name="reorder_level"
                    min="0"
                    value="5"
                    required
                >

            </div>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Add Spare Part
            </button>

            <a
                href="{{ url_for('spare_parts.spare_parts') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
