{% extends "base.html" %}


{% block title %}

Edit Machine | FixTrack

{% endblock %}


{% block content %}

<div class="page-header">

    <h1>Edit Machine</h1>

    <p>
        Update machine details.
    </p>

</div>


<div class="form-card">

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>Machine Number</label>

                <input
                    type="text"
                    name="machine_number"
                    value="{{ machine['machine_number'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Machine Name</label>

                <input
                    type="text"
                    name="machine_name"
                    value="{{ machine['machine_name'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Department</label>

                <input
                    type="text"
                    name="department"
                    value="{{ machine['department'] }}"
                >

            </div>


            <div class="form-group">

                <label>Manufacturer</label>

                <input
                    type="text"
                    name="manufacturer"
                    value="{{ machine['manufacturer'] }}"
                >

            </div>


            <div class="form-group">

                <label>Model</label>

                <input
                    type="text"
                    name="model"
                    value="{{ machine['model'] }}"
                >

            </div>


            <div class="form-group">

                <label>Status</label>

                <select name="status">

                    <option
                        value="Active"
                        {% if machine["status"] == "Active" %}
                            selected
                        {% endif %}
                    >
                        Active
                    </option>

                    <option
                        value="Inactive"
                        {% if machine["status"] == "Inactive" %}
                            selected
                        {% endif %}
                    >
                        Inactive
                    </option>

                </select>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('machines.machines') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Update Machine
            </button>

        </div>

    </form>

</div>

{% endblock %}
