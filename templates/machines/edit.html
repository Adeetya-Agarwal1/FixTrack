{% extends "base.html" %}

{% block title %}
Edit Machine | FixTrack
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <div class="eyebrow">ASSET MANAGEMENT</div>
        <h1>Edit Machine</h1>
        <p>Update the information for this factory machine.</p>
    </div>
</div>

<div class="form-card">

    <div class="form-card-header">
        <div class="form-card-icon">⚙</div>

        <div>
            <h2>Machine Details</h2>
            <p>Modify the machine information below.</p>
        </div>
    </div>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Machine Number</label>
                <input
                    type="text"
                    name="machine_number"
                    value="{{ machine['machine_number'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Machine Name</label>
                <input
                    type="text"
                    name="machine_name"
                    value="{{ machine['machine_name'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Department</label>
                <input
                    type="text"
                    name="department"
                    value="{{ machine['department'] or '' }}"
                >
            </div>

            <div class="form-group">
                <label>Manufacturer</label>
                <input
                    type="text"
                    name="manufacturer"
                    value="{{ machine['manufacturer'] or '' }}"
                >
            </div>

            <div class="form-group">
                <label>Model</label>
                <input
                    type="text"
                    name="model"
                    value="{{ machine['model'] or '' }}"
                >
            </div>

            <div class="form-group">
                <label>Status</label>

                <select name="status">

                    <option
                        value="Active"
                        {% if machine['status'] == 'Active' %}selected{% endif %}
                    >
                        Active
                    </option>

                    <option
                        value="Inactive"
                        {% if machine['status'] == 'Inactive' %}selected{% endif %}
                    >
                        Inactive
                    </option>

                </select>
            </div>

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('machines.machines') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
