{% extends "base.html" %}

{% block title %}
Add Machine | FixTrack
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <div class="eyebrow">
            ASSET MANAGEMENT
        </div>

        <h1>Add Machine</h1>

        <p>
            Register a new machine in the factory equipment system.
        </p>

    </div>

</div>


<div class="form-card">

    <div class="form-card-header">

        <div class="form-card-icon">
            ⚙
        </div>

        <div>

            <h2>Machine Details</h2>

            <p>
                Enter the basic information for this machine.
            </p>

        </div>

    </div>


    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Machine Number
                </label>

                <input
                    type="text"
                    name="machine_number"
                    placeholder="e.g. M-002"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Machine Name
                </label>

                <input
                    type="text"
                    name="machine_name"
                    placeholder="e.g. CNC Machine"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Department
                </label>

                <input
                    type="text"
                    name="department"
                    placeholder="e.g. Production"
                >

            </div>


            <div class="form-group">

                <label>
                    Manufacturer
                </label>

                <input
                    type="text"
                    name="manufacturer"
                    placeholder="e.g. Siemens"
                >

            </div>


            <div class="form-group">

                <label>
                    Model
                </label>

                <input
                    type="text"
                    name="model"
                    placeholder="e.g. CNC-100"
                >

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select name="status">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </div>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Add Machine
            </button>

            <a
                href="{{ url_for('machines.machines') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
