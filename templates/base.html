<!DOCTYPE html>
<html lang="en">

<head>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FixTrack
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

        <div class="main-content">

            <main class="page-content">

                {% block content %}

            </main>

        </div>

    </div>


    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
